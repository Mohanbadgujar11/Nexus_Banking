# Enable Docker Compose integration
spring.docker.compose.enabled=false

# Server Port (Render injects $PORT dynamically)
server.port=${PORT:8080}

# Database Connection Settings (Configured for TiDB Serverless Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SZaiBF5v8j96BFk.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:P6lSgjJLAQh5kRID}

# HikariCP Connection Pool (Optimized for TiDB Serverless)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Settings (Explicit MySQL Dialect for TiDB)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Initialization Settings
spring.sql.init.mode=never