# Enable Docker Compose integration
spring.docker.compose.enabled=false

# Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_banking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization Settings (Let Hibernate manage schema dynamically)
spring.sql.init.mode=never